<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>刀客轻研 · 新闻双语图文</title>
<style>
  @font-face{font-family:'SourceSerif';src:url('file:///Users/Jin/Library/Fonts/SourceHanSerifSC-Regular.otf');font-weight:400}
  @font-face{font-family:'SourceSerif';src:url('file:///Users/Jin/Library/Fonts/SourceHanSerifSC-Medium.otf');font-weight:500}
  @font-face{font-family:'SourceSerif';src:url('file:///Users/Jin/Library/Fonts/SourceHanSerifSC-SemiBold.otf');font-weight:600}
  @font-face{font-family:'SourceSerif';src:url('file:///Users/Jin/Library/Fonts/SourceHanSerifSC-Bold.otf');font-weight:700}
  @font-face{font-family:'SourceSerif';src:url('file:///Users/Jin/Library/Fonts/SourceHanSerifSC-Heavy.otf');font-weight:900}
  :root{
    --blue:#006EBB; --deep:#004E86; --ink:#1A222C; --gray:#6B7787;
    --line:#E3E8EF; --pale:#F4F8FC;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#fff}
  body{font-family:'SourceSerif','PingFang SC',serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  .sheet{width:1080px;height:1440px;background:#fff;display:flex;flex-direction:column;overflow:hidden;position:relative}
  .head{padding:34px 64px 0 64px;display:flex;justify-content:space-between;align-items:flex-start;flex:0 0 auto}
  .tag{border:2px solid var(--blue);color:var(--blue);border-radius:999px;padding:8px 22px;font-size:24px;font-weight:600;line-height:1}
  .brand{text-align:right}
  .brand img{height:34px;display:block;margin-left:auto}
  .brand .kw{font-size:17px;color:var(--gray);margin-top:9px;letter-spacing:.02em}
  .lead{padding:0 64px;flex:0 0 auto}
  .srcline{font-size:24px;color:var(--gray);margin-top:36px;display:flex;align-items:center;gap:12px}
  .srcline i{width:28px;height:2px;background:var(--blue);display:inline-block;font-style:normal}
  .t-cn{font-size:56px;font-weight:900;color:var(--blue);line-height:1.3;margin-top:22px}
  .t-en{font-size:27px;color:var(--gray);line-height:1.45;margin-top:18px}
  .rule{height:5px;background:#3A3F45;margin:26px 64px 0 64px;flex:0 0 auto}
  .body{flex:1 1 auto;overflow:hidden;padding:26px 64px 96px 64px}
  .blk{margin-bottom:46px}
  .blk:last-child{margin-bottom:0}
  .en{font-size:22px;color:var(--gray);line-height:1.62}
  .cn{font-size:44px;color:var(--ink);line-height:1.62;font-weight:600;text-indent:2em}
  .en + .cn{margin-top:14px}
  .figblk{margin-bottom:46px}
  .figblk img{width:100%;display:block;border-radius:6px}
  .figblk .figcap{font-size:18px;color:#6B7787;line-height:1.55;margin-top:10px}
  .contpart .cn{text-indent:0}
  .cont .head{padding-top:38px}
  .foot{flex:0 0 auto;height:70px;background:var(--deep);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding:0 64px;font-size:22px}
  .foot .fl{opacity:.92}
  .foot .pg{font-weight:600;letter-spacing:.06em}
  /* 封面页（图片在上、标题在下） */
  .cover .cover-wrap{flex:0 0 auto;height:900px;position:relative;overflow:hidden;background:var(--pale)}
  .cover .cover-wrap img{width:1080px;height:100%;object-fit:cover;display:block}
  .cover .hint{position:absolute;right:44px;bottom:40px;display:flex;align-items:center;gap:12px;
    background:rgba(255,255,255,.94);color:var(--blue);font-size:27px;font-weight:700;
    padding:13px 26px;border-radius:999px;box-shadow:0 6px 20px rgba(0,60,120,.16)}
  .cover .hint .ar{font-size:28px;line-height:1}
  .cover .cover-text{flex:1 1 auto;padding:26px 64px 0 64px;min-height:0}
  .cover .srcline{margin-top:0}
  .cover .t-cn{font-size:49px;margin-top:12px}
  .cover .t-en{font-size:23px;margin-top:10px}
  .cover .credit{font-size:18px;color:#98A2AE;margin-top:12px}
  .cover .lede{font-size:26px;color:#45505C;line-height:1.56;margin-top:16px;font-weight:400}
</style>
</head>
<body>
<div id="meta" data-pages="0" data-overflow="0"></div>
<script>
const DATA = __DATA__;
const FONTS_READY = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
const KW = '医学前沿 · 科研动态 · 医务生活';
const LOGO_SRC = DATA.logo || '../assets/logo.png';
const GAP = 46, CN_GAP = 14, PAD_TOP = 26, PAD_BOTTOM = 96, GAP_CEIL = 46;
const HAS_EN = DATA.blocks.some(b => b.en);

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function makeSheet(n, first){
  const s = document.createElement('section');
  s.className = 'sheet' + (first ? '' : ' cont');
  s.innerHTML = `<div class="head">` +
      (first ? `<div class="tag">${esc(DATA.tag||'新闻速览')}</div>` : `<div></div>`) +
      `<div class="brand"><img src="${LOGO_SRC}"><div class="kw">${KW}</div></div></div>`;
  if (first){
    const lead = document.createElement('div');
    lead.className = 'lead';
    lead.innerHTML =
      `<div class="srcline"><i></i>${esc(DATA.source||'')}</div>` +
      (DATA.title_cn ? `<h1 class="t-cn">${esc(DATA.title_cn)}</h1>` : '') +
      (DATA.title_en ? `<p class="t-en">${esc(DATA.title_en)}</p>` : '');
    s.appendChild(lead);
    const rule = document.createElement('div');
    rule.className = 'rule';
    s.appendChild(rule);
  }
  const body = document.createElement('div');
  body.className = 'body';
  s.appendChild(body);
  const foot = document.createElement('div');
  foot.className = 'foot';
  foot.innerHTML = `<span class="pg">${n}</span>`;
  s.appendChild(foot);
  document.body.appendChild(s);
  return {sheet:s, body};
}

function makeBlock(b){
  const d = document.createElement('div');
  if (b.img){
    d.className = 'blk figblk';
    d.innerHTML = `<img src="${b.img}">` +
                  (b.figcap ? `<div class="figcap">${esc(b.figcap)}</div>` : '');
    return d;
  }
  d.className = 'blk';
  d.innerHTML = (b.en ? `<p class="en">${esc(b.en)}</p>` : '') +
                (b.cn ? `<p class="cn">${esc(b.cn)}</p>` : '');
  return d;
}

function makeCover(n){
  const s = document.createElement('section');
  s.className = 'sheet cover';
  s.innerHTML =
    `<div class="head"><div class="tag">${esc(DATA.tag||'新闻速读')}</div>` +
    `<div class="brand"><img src="${LOGO_SRC}"><div class="kw">${KW}</div></div></div>` +
    `<div class="cover-wrap"><img src="${DATA.cover}">` +
    `<div class="hint">${esc(DATA.cover_hint||'右滑阅读全文')}<span class="ar">→</span></div></div>` +
    `<div class="cover-text">` +
      `<div class="srcline"><i></i>${esc(DATA.source||'')}</div>` +
      (DATA.title_cn ? `<h1 class="t-cn">${esc(DATA.title_cn)}</h1>` : '') +
      (DATA.title_en ? `<p class="t-en">${esc(DATA.title_en)}</p>` : '') +
      (DATA.lead ? `<p class="lede">${esc(DATA.lead)}</p>` : '') +
      (DATA.credit ? `<p class="credit">${esc(DATA.credit)}</p>` : '') +
    `</div>` +
    `<div class="foot"><span class="pg">${n}</span></div>`;
  document.body.appendChild(s);
  return {sheet:s};
}

/* 1) 先量两种页面的可用高度（首页有题录、续页只有 logo） */
const HAS_COVER = !!DATA.cover;
FONTS_READY.then(()=>{
const p1 = makeSheet(1, true);
const pc = makeSheet(2, false);
const A1 = p1.body.clientHeight - PAD_TOP - PAD_BOTTOM;
const A2 = pc.body.clientHeight - PAD_TOP - PAD_BOTTOM;
p1.sheet.remove(); pc.sheet.remove();

const sheets = [];
if (HAS_COVER) sheets.push(makeCover(1));

function newPage(){
  const first = (!HAS_COVER && sheets.length === 0);
  const sh = makeSheet(sheets.length + 1, first);
  sh.cap = first ? A1 : A2;
  sheets.push(sh);
  return sh;
}
const limitY = sh => sh.body.getBoundingClientRect().top + PAD_TOP + sh.cap;

/* 2) 逐块流式排版：排到底线就换页，段落允许跨页切分（间距全页统一，不拉伸） */
function fitChars(el, cnEl, full, limit){
  let lo = 1, hi = full.length, best = 0;
  while (lo <= hi){
    const mid = (lo + hi) >> 1;
    cnEl.textContent = full.slice(0, mid);
    if (el.getBoundingClientRect().bottom <= limit + 0.5){ best = mid; lo = mid + 1; }
    else hi = mid - 1;
  }
  cnEl.textContent = full;
  return best;
}

let cur = newPage();
const queue = DATA.blocks.slice();
let guard = 0;
while (queue.length && guard++ < 500){
  const spec = queue.shift();
  const el = makeBlock(spec);
  if (spec._cont) el.classList.add('contpart');
  cur.body.appendChild(el);

  if (el.getBoundingClientRect().bottom <= limitY(cur) + 0.5) continue;

  const cnEl = el.querySelector('.cn');
  const onlyCN = cnEl && !el.querySelector('.en');
  if (onlyCN){
    const full = cnEl.textContent;
    const limit = limitY(cur);
    const maxK = fitChars(el, cnEl, full, limit);
    // 先把本页写满（cut = 物理最大可容纳字数），只在“下一页会以标点开头”时回退 1–2 字
    const NO_START = '，。、；：！？）》」』”’%‰℃·,.;:!?)';
    let k = maxK;
    while (k > 1 && NO_START.indexOf(full.charAt(k)) >= 0) k--;
    if (full.slice(k).trim().length < 2) k = Math.max(1, k - 1);
    if (k >= 1 && k < full.length){
      cnEl.textContent = full.slice(0, k);
      const rest = full.slice(k).replace(/^\s+/, '');
      cur = newPage();
      queue.unshift({ cn: rest, _cont: true });
      continue;
    }
  }
  // 不能切（双语块或一个字都放不下）：整块搬到下一页
  cur.body.removeChild(el);
  cur = newPage();
  cur.body.appendChild(el);
}

/* 3) 只做收尾：页脚页码、自检 */
let overflow = 0;
const DBG = [];
sheets.forEach((sh, i)=>{
  if (!sh.body) return;
  const kids = sh.body.children;
  const lastEl = kids[kids.length - 1];
  if (lastEl && lastEl.getBoundingClientRect().bottom > limitY(sh) + 1) overflow++;
  DBG.push({p:i+1, blocks:kids.length});
});

const total = sheets.length;
sheets.forEach((s,i)=>{ s.sheet.querySelector('.foot .pg').textContent = (i+1) + ' / ' + total; });
const meta = document.getElementById('meta');
meta.dataset.pages = total;
meta.dataset.overflow = overflow;
meta.dataset.debug = JSON.stringify(DBG);
document.title = 'PAGES:' + total;
});
</script>
</body>
</html>
