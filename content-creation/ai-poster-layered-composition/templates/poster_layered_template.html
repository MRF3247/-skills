<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<!--
  AI 海报分层合成模板（1242×1656，3:4，Chrome headless @2x 导出）
  用法：把 ${key} 占位替换为实际值（用 str.replace，勿用 str.format —— CSS 花括号会冲突）。
  bandbg=标题区实底背板色；shadeA/shadeB=上下渐变遮罩色；leadbg=引导句背板；
  txtbg=信息卡底色；chipbg=STEP 标签底色；shadow=文字阴影；footbg=页脚底色。
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1242px; height:1656px; font-family:"PingFang SC","Hiragino Sans GB",sans-serif; position:relative; overflow:hidden; }

  /* ---------- 封面版式：插画占上部 1242px，文字区 414px ---------- */
  .cover { width:1242px; height:1656px; position:relative; }
  .art { position:absolute; top:0; left:0; width:1242px; height:1242px; }
  .art img { width:100%; height:100%; object-fit:cover; display:block; }
  .seam { position:absolute; top:1202px; left:0; width:1242px; height:80px;
          background:linear-gradient(to bottom, transparent 0%, ${bg} 100%); } /* 接缝渐变 */
  .textzone { position:absolute; bottom:0; left:0; width:1242px; height:414px; padding:26px 80px 66px;
              display:flex; flex-direction:column; justify-content:center; background:${bg}; }
  .kicker { font-size:30px; letter-spacing:10px; font-weight:700; margin-bottom:16px; color:${kicker}; }
  .title { font-size:92px; font-weight:900; line-height:1.18; letter-spacing:3px; color:${text}; }
  .hl { color:${hl}; }
  .sub { font-size:34px; margin-top:22px; font-weight:500; letter-spacing:2px; color:${sub}; }
  .tags { position:absolute; bottom:30px; left:80px; font-size:26px; letter-spacing:3px; color:${tags}; }

  /* ---------- 方法卡版式：全幅背景 + 分层文字 ---------- */
  .page { width:1242px; height:1656px; position:relative; }
  .bg { position:absolute; top:0; left:0; width:1242px; height:1656px; }
  .bg img { width:100%; height:100%; object-fit:cover; display:block; }
  .shade-top { position:absolute; top:0; left:0; width:1242px; height:560px;
               background:linear-gradient(to bottom, ${shadeA} 0%, ${shadeB} 62%, transparent 100%); }
  .shade-bot { position:absolute; bottom:0; left:0; width:1242px; height:220px;
               background:linear-gradient(to top, ${shadeA} 0%, ${shadeB} 55%, transparent 100%); }
  .headband { position:absolute; top:0; left:0; width:1242px; height:430px; background:${bandbg}; z-index:1; }
  .overlay { position:absolute; top:0; left:0; width:1242px; height:1656px; padding:64px 84px;
             display:flex; flex-direction:column; color:${text}; z-index:2; }
  .step { align-self:flex-end; font-size:26px; border:3px solid ${step}; color:${step};
          padding:10px 26px; letter-spacing:6px; font-weight:700; border-radius:60px; background:${chipbg}; }
  .kicker { font-size:30px; font-weight:700; letter-spacing:6px; margin:20px 0 10px; color:${hl}; }
  .title { font-size:64px; font-weight:900; line-height:1.3; letter-spacing:1px; margin-bottom:14px;
           text-shadow:0 2px 12px ${shadow}; }
  .divider { width:110px; height:8px; background:${hl}; margin-bottom:24px; }
  .lead { font-size:35px; line-height:1.6; margin-bottom:26px; color:${lead}; padding:16px 24px;
          border-radius:12px; background:${leadbg}; border-left:8px solid ${hl}; }
  .cards { display:flex; flex-direction:column; gap:20px; }
  .info { border-radius:14px; padding:24px 32px; background:${txtbg}; border-left:10px solid ${hl}; }
  .lbl { font-size:31px; font-weight:800; margin-bottom:8px; color:${hl}; }
  .txt { font-size:33px; line-height:1.65; font-weight:500; color:${text}; }
  .foot { margin-top:auto; font-size:26px; letter-spacing:3px; color:${foot};
          text-shadow:0 1px 8px ${shadow}; padding:10px 16px; border-radius:10px;
          background:${footbg}; align-self:flex-start; }
</style>
</head>
<body>
<!-- 封面示例 -->
<div class="cover">
  <div class="art"><img src="${art}"></div>
  <div class="seam"></div>
  <div class="textzone">
    <div class="kicker">科研人 · 文献检索方法论</div>
    <div class="title">找经典文献<br><span class="hl">不用瞎翻</span></div>
    <div class="sub">从「开山之作」到「最新热点」，一套 5 步检索法</div>
    <div class="tags">#医学文献 #科研干货 #论文检索</div>
  </div>
</div>

<!-- 方法卡示例 -->
<div class="page">
  <div class="bg"><img src="${art2}"></div>
  <div class="shade-top"></div>
  <div class="shade-bot"></div>
  <div class="headband"></div>
  <div class="overlay">
    <div class="step">STEP 01</div>
    <div class="kicker">第一步 · 锁定领域</div>
    <div class="title">锁定领域<br>「奠基性核心文献」</div>
    <div class="divider"></div>
    <div class="lead">不要上来就搜最新研究，先找领域的<b>「开山之作」</b></div>
    <div class="cards">
      <div class="info"><div class="lbl">操作方法</div><div class="txt">用 Web of Science / 知网搜关键词，按被引频次从高到低排序</div></div>
      <div class="info"><div class="lbl">为什么</div><div class="txt">前 10 篇基本都是公认经典，哪怕 10 年前也一定要读，是整个领域的研究基础</div></div>
      <div class="info"><div class="lbl">重点看</div><div class="txt">研究问题、核心结论、局限性，后面 90% 的研究都在这个框架上延伸</div></div>
    </div>
    <div class="foot">找经典文献不用瞎翻 · 第 1/5 步</div>
  </div>
</div>
</body>
</html>
